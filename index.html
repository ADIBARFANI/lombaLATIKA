<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Waste Classifier</title>
  <script>
    (function(){try{var s=localStorage.getItem("swc-theme");
      if(s==="dark"||(!s&&matchMedia("(prefers-color-scheme:dark)").matches))
      document.documentElement.classList.add("dark");}catch(e){}})();
  </script>
  <style>
    /* ==========================================================================
   Smart Waste Classifier — single stylesheet
   Sections:
     1.  Design tokens
     2.  Reset & base
     3.  Layout
     4.  Navbar
     5.  Pills
     6.  Buttons
     7.  Cards
     8.  Alerts
     9.  Scan page — idle
     10. Scan page — camera
     11. Scan page — analyzing
     12. Scan page — result
     13. History page
     14. Footer
     15. Animations
     16. Accessibility
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Design tokens
   -------------------------------------------------------------------------- */
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --text: #1e293b;
  --text-muted: #64748b;
  --text-faint: #94a3b8;
  --border: #e2e8f0;

  --accent: #10b981;
  --accent-hover: #059669;
  --accent-soft: #ecfdf5;
  --accent-soft-text: #047857;

  --amber-soft: #fef3c7;
  --amber-text: #92400e;
  --orange-soft: #ffedd5;
  --orange-text: #9a3412;
  --danger-soft: #fef2f2;
  --danger-text: #b91c1c;

  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.06);
  --shadow-md: 0 4px 10px -4px rgb(0 0 0 / 0.12);

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 24px;
  --container: 720px;
}

html.dark {
  --bg: #020617;
  --surface: #0f172a;
  --surface-2: #1e293b;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --text-faint: #64748b;
  --border: #1e293b;

  --accent-soft: rgba(16, 185, 129, 0.12);
  --accent-soft-text: #6ee7b7;
  --amber-soft: rgba(245, 158, 11, 0.15);
  --amber-text: #fcd34d;
  --orange-soft: rgba(249, 115, 22, 0.15);
  --orange-text: #fdba74;
  --danger-soft: rgba(239, 68, 68, 0.12);
  --danger-text: #fca5a5;

  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.4);
  --shadow-md: 0 4px 10px -4px rgb(0 0 0 / 0.5);
}

/* --------------------------------------------------------------------------
   2. Reset & base
   -------------------------------------------------------------------------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

html {
  -webkit-tap-highlight-color: transparent;
  color-scheme: light dark;
}

body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color 0.2s, color 0.2s;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  cursor: pointer;
}

img {
  max-width: 100%;
  display: block;
}

::selection {
  background: rgba(16, 185, 129, 0.25);
}

/* --------------------------------------------------------------------------
   3. Layout
   -------------------------------------------------------------------------- */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.main {
  flex: 1;
}

.page-container {
  width: 100%;
  max-width: var(--container);
  margin: 0 auto;
  padding: 24px 16px 56px;
}

@media (min-width: 640px) {
  .page-container {
    padding: 40px 24px 64px;
  }
}

/* --------------------------------------------------------------------------
   4. Navbar
   -------------------------------------------------------------------------- */
.navbar {
  position: sticky;
  top: 0;
  z-index: 30;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

@supports (background: color-mix(in srgb, red, blue)) {
  .navbar {
    background: color-mix(in srgb, var(--surface) 82%, transparent);
  }
}

.navbar-inner {
  max-width: var(--container);
  margin: 0 auto;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  gap: 8px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.brand-icon {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: var(--r-md);
  background: var(--accent);
  color: #ffffff;
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}

.brand-name {
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (max-width: 420px) {
  .brand-name {
    display: none;
  }
}

.navbar-actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: var(--r-md);
  background: transparent;
  color: var(--text-muted);
  transition: background 0.15s;
}

.icon-btn:hover {
  background: var(--surface-2);
}

.icon-btn-lang {
  width: auto;
  padding: 0 8px;
  gap: 4px;
  display: inline-flex;
  font-size: 11px;
  font-weight: 700;
}

.navbar-tabs {
  max-width: var(--container);
  margin: 0 auto;
  display: flex;
  gap: 4px;
  padding: 0 16px 8px;
}

.tab {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: var(--r-md);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  transition: background 0.15s, color 0.15s;
  flex: 1;
}

.tab:hover {
  background: var(--surface-2);
}

.tab-active {
  background: var(--accent-soft);
  color: var(--accent-soft-text);
}

@media (min-width: 480px) {
  .tab {
    flex: 0 0 auto;
  }
}

/* --------------------------------------------------------------------------
   5. Pills
   -------------------------------------------------------------------------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}

.pill-amber {
  background: var(--amber-soft);
  color: var(--amber-text);
}

.pill-orange {
  background: var(--orange-soft);
  color: var(--orange-text);
}

.pill-success {
  background: var(--accent-soft);
  color: var(--accent-soft-text);
}

.pill-muted {
  background: var(--surface-2);
  color: var(--text-muted);
  font-weight: 600;
}

.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dot-yellow { background: #fbbf24; }
.dot-blue   { background: #0ea5e9; }
.dot-green  { background: #10b981; }
.dot-red    { background: #f43f5e; }

/* --------------------------------------------------------------------------
   6. Buttons
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 16px;
  border-radius: var(--r-md);
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  border: 1px solid transparent;
  transition: transform 0.08s, background 0.15s, border-color 0.15s, color 0.15s;
  white-space: nowrap;
}

.btn:active {
  transform: scale(0.98);
}

.btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.btn:disabled {
  opacity: 0.5;
  pointer-events: none;
}

.btn-primary {
  background: var(--accent);
  color: #ffffff;
}

.btn-primary:hover {
  background: var(--accent-hover);
}

.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
}

.btn-secondary:hover {
  background: var(--border);
}

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  border-color: var(--border);
}

.btn-ghost:hover {
  background: var(--surface-2);
  color: var(--text);
}

.btn-sm {
  padding: 8px 12px;
  font-size: 12px;
}

/* --------------------------------------------------------------------------
   7. Cards
   -------------------------------------------------------------------------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: 20px;
  box-shadow: var(--shadow-sm);
}

.card-tight {
  padding: 12px;
}

.card-section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 12px;
}

/* --------------------------------------------------------------------------
   8. Alerts
   -------------------------------------------------------------------------- */
.alert {
  padding: 12px 16px;
  border-radius: var(--r-md);
  font-size: 14px;
  line-height: 1.45;
}

.alert-error {
  background: var(--danger-soft);
  color: var(--danger-text);
  border: 1px solid rgba(185, 28, 28, 0.2);
}

html.dark .alert-error {
  border-color: rgba(252, 165, 165, 0.25);
}

/* --------------------------------------------------------------------------
   9. Scan page — idle
   -------------------------------------------------------------------------- */
.scan-page {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.page-heading {
  text-align: center;
  margin-bottom: 4px;
}

.page-title {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0;
}

@media (min-width: 640px) {
  .page-title {
    font-size: 30px;
  }
}

.page-subtitle {
  margin: 6px auto 0;
  max-width: 420px;
  font-size: 14px;
  color: var(--text-muted);
}

.dropzone {
  background: var(--surface);
  border: 2px dashed var(--border);
  border-radius: var(--r-xl);
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  text-align: center;
  transition: border-color 0.2s, background 0.2s;
}

.dropzone.dropzone-active {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.dropzone-icon {
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  border-radius: var(--r-xl);
  background: var(--accent-soft);
  color: var(--accent);
}

.dropzone-title {
  margin: 0;
  font-size: 16px;
  font-weight: 700;
}

.dropzone-subtitle {
  margin: 4px auto 0;
  max-width: 380px;
  font-size: 12px;
  color: var(--text-muted);
}

.dropzone-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
}

@media (min-width: 480px) {
  .dropzone-actions {
    flex-direction: row;
    justify-content: center;
    width: auto;
  }
  .dropzone-actions .btn {
    padding-left: 24px;
    padding-right: 24px;
  }
}

/* AI settings disclosure */
.ai-settings {
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  overflow: hidden;
}

.ai-settings summary {
  cursor: pointer;
  padding: 12px 16px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  list-style: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.ai-settings summary::-webkit-details-marker { display: none; }

.ai-settings[open] summary {
  border-bottom: 1px solid var(--border);
}

.ai-settings-body {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ai-settings-body p {
  margin: 0;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.5;
}

.ai-settings input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--bg);
  color: var(--text);
  font: inherit;
  font-size: 13px;
}

.ai-settings input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.ai-settings-actions {
  display: flex;
  gap: 8px;
}

.ai-settings-status {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* --------------------------------------------------------------------------
   10. Scan page — camera
   -------------------------------------------------------------------------- */
.camera-view {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.camera-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  background: #000;
  border-radius: var(--r-lg);
  overflow: hidden;
}

@media (min-width: 640px) {
  .camera-frame { aspect-ratio: 16 / 9; }
}

.camera-frame video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.camera-actions {
  display: flex;
  gap: 10px;
}

.camera-actions .btn-primary { flex: 1; }

/* --------------------------------------------------------------------------
   11. Scan page — analyzing
   -------------------------------------------------------------------------- */
.analyzing-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 48px 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-sm);
}

.analyzing-preview {
  position: relative;
  width: 160px;
  height: 160px;
  border-radius: var(--r-xl);
  overflow: hidden;
  background: var(--surface-2);
}

.analyzing-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.analyzing-overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(0, 0, 0, 0.45);
  color: #ffffff;
}

.analyzing-text {
  text-align: center;
}

.analyzing-text strong {
  display: block;
  font-size: 14px;
}

.analyzing-text span {
  display: block;
  margin-top: 4px;
  font-size: 12px;
  color: var(--text-muted);
}

/* --------------------------------------------------------------------------
   12. Scan page — result
   -------------------------------------------------------------------------- */
.result-view {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.result-hero {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.result-image {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  background: var(--surface-2);
}

.result-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.result-image-placeholder {
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  font-size: 48px;
}

.result-image-label {
  position: absolute;
  top: 12px;
  left: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.6);
  color: #ffffff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  backdrop-filter: blur(4px);
}

.result-header {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.result-title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.result-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.result-title .emoji {
  font-size: 30px;
  line-height: 1;
}

.result-title h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  line-height: 1.2;
}

.result-confidence {
  margin: 3px 0 0;
  font-size: 12px;
  color: var(--text-muted);
}

.result-confidence strong {
  color: var(--text);
}

.confidence-bar {
  width: 100%;
  height: 8px;
  background: var(--surface-2);
  border-radius: 999px;
  overflow: hidden;
}

.confidence-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
  transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1);
}

.result-streak-note {
  margin: 6px 0 0;
  font-size: 11px;
  color: var(--text-faint);
  font-weight: 500;
}

.bin-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  border-radius: var(--r-lg);
  box-shadow: inset 0 0 0 2px currentColor;
}

.bin-card-icon {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: var(--r-md);
  background: rgba(255, 255, 255, 0.3);
  flex-shrink: 0;
}

.bin-card strong {
  font-size: 14px;
  font-weight: 700;
  line-height: 1.25;
}

.bin-card p {
  margin: 2px 0 0;
  font-size: 11px;
  opacity: 0.85;
  line-height: 1.4;
}

.bin-yellow { background: #fbbf24; color: #451a03; }
.bin-blue   { background: #0ea5e9; color: #ffffff; }
.bin-green  { background: #10b981; color: #ffffff; }
.bin-red    { background: #f43f5e; color: #ffffff; }

.tips-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tips-list li {
  display: flex;
  gap: 10px;
  font-size: 14px;
  line-height: 1.5;
}

.tips-list li svg {
  flex-shrink: 0;
  margin-top: 3px;
  color: var(--accent);
}

.fact-box {
  padding: 20px;
  border-radius: var(--r-xl);
  background: var(--accent-soft);
  border: 1px solid rgba(16, 185, 129, 0.25);
}

html.dark .fact-box {
  border-color: rgba(16, 185, 129, 0.3);
}

.fact-box h3 {
  margin: 0 0 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent-soft-text);
  display: flex;
  align-items: center;
  gap: 6px;
}

.fact-box p {
  margin: 0;
  font-size: 14px;
  line-height: 1.55;
  color: var(--accent-soft-text);
  opacity: 0.9;
}

/* --------------------------------------------------------------------------
   13. History page
   -------------------------------------------------------------------------- */
.history-page {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.history-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}

.history-heading h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.history-heading p {
  margin: 3px 0 0;
  font-size: 12px;
  color: var(--text-muted);
}

.history-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.history-summary .card {
  padding: 12px;
  text-align: center;
  border-radius: var(--r-lg);
}

.history-summary svg {
  color: var(--accent);
  margin: 0 auto 4px;
  display: block;
}

.history-summary strong {
  display: block;
  font-size: 18px;
  font-weight: 700;
  line-height: 1;
}

.history-summary span {
  display: block;
  margin-top: 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.history-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.history-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}

.history-thumb {
  width: 56px;
  height: 56px;
  border-radius: var(--r-md);
  background: var(--surface-2);
  overflow: hidden;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  font-size: 22px;
}

.history-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.history-body {
  flex: 1;
  min-width: 0;
}

.history-body strong {
  display: block;
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.history-body time {
  display: block;
  font-size: 11px;
  color: var(--text-faint);
  margin-top: 2px;
}

.history-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}

.history-confidence {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent-soft-text);
}

.history-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 56px 20px;
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
}

.history-empty-icon {
  display: grid;
  place-items: center;

const DICTIONARIES = { en, id };
let currentLocale = "en";
const localeListeners = new Set();

function getValue(source, path) {
  return path.split(".").reduce((acc, key) => {
    if (acc && typeof acc === "object" && key in acc) return acc[key];
    return undefined;
  }, source);
}

const getLocale = () => currentLocale;

function setLocale(locale) {
  if (!SUPPORTED_LOCALES.includes(locale)) return;
  currentLocale = locale;
  try { localStorage.setItem(LOCALE_KEY, locale); } catch {}
  document.documentElement.lang = locale;
  localeListeners.forEach((fn) => fn(locale));
}

const onLocaleChange = (fn) => {
  localeListeners.add(fn);
  return () => localeListeners.delete(fn);
};

function t(path, vars) {
  const dict = DICTIONARIES[currentLocale] || en;
  let value = getValue(dict, path);
  if (value === undefined) value = getValue(en, path);
  if (typeof value !== "string") return path;
  if (!vars) return value;
  return value.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
}

function tList(path) {
  const dict = DICTIONARIES[currentLocale] || en;
  let value = getValue(dict, path);
  if (value === undefined) value = getValue(en, path);
  return Array.isArray(value) ? value.filter((v) => typeof v === "string") : [];
}

function initLocale() {
  let stored = null;
  try { stored = localStorage.getItem(LOCALE_KEY); } catch {}
  if (stored && SUPPORTED_LOCALES.includes(stored)) {
    currentLocale = stored;
  } else {
    const browser = (navigator.language || "en").slice(0, 2);
    currentLocale = SUPPORTED_LOCALES.includes(browser) ? browser : "en";
  }
  document.documentElement.lang = currentLocale;
}

function formatDateTime(timestamp, locale = "en") {
  const tag = locale === "id" ? "id-ID" : "en-US";
  return new Intl.DateTimeFormat(tag, {
    day: "numeric", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit",
  }).format(new Date(timestamp));
}

async function createThumbnail(file, maxSize = 320) {
  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height));
    const width = Math.max(1, Math.round(bitmap.width * scale));
    const height = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    if (!ctx) return null;
    ctx.drawImage(bitmap, 0, 0, width, height);
    bitmap.close?.();
    return canvas.toDataURL("image/jpeg", 0.7);
  } catch {
    return null;
  }
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function dayKey(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function nextStreak(lastScanDate, current) {
  const today = dayKey();
  if (lastScanDate === today) return Math.max(current, 1);
  const yesterday = dayKey(new Date(Date.now() - 86400000));
  if (lastScanDate === yesterday) return current + 1;
  return 1;
}

  const history = Array.isArray(raw.history)
    ? raw.history.filter(
        (r) => r && typeof r.id === "string" && isWasteCategory(r.category) &&
          typeof r.confidence === "number" && typeof r.timestamp === "number" &&
          (typeof r.thumbnail === "string" || r.thumbnail === null),
      ).slice(0, MAX_HISTORY)
    : [];
  return {
    points: typeof raw.points === "number" && raw.points >= 0 ? raw.points : 0,
    streak: typeof raw.streak === "number" && raw.streak >= 0 ? raw.streak : 0,
    lastScanDate: typeof raw.lastScanDate === "string" ? raw.lastScanDate : null,
    history,
  };
}

function loadUser() {
  if (userLoaded) return userState;
  try {
    const raw = localStorage.getItem(USER_KEY);
    userState = raw ? sanitizeUser(JSON.parse(raw)) : { ...EMPTY_USER };
  } catch {
    userState = { ...EMPTY_USER };
  }
  userLoaded = true;
  return userState;
}

const getUser = () => userState;

function persistUser() {
  try { localStorage.setItem(USER_KEY, JSON.stringify(userState)); } catch {}
}

function emitUser() {
  userListeners.forEach((fn) => fn(userState));
}

function onUserChange(fn) {
  userListeners.add(fn);
  return () => userListeners.delete(fn);
}

function addScan({ category, confidence, thumbnail }) {
  const streak = nextStreak(userState.lastScanDate, userState.streak);
  const record = {
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    category, confidence, thumbnail, timestamp: Date.now(),
  };
  userState = {
    points: userState.points + POINTS_PER_SCAN,
    streak,
    lastScanDate: dayKey(),
    history: [record, ...userState.history].slice(0, MAX_HISTORY),
  };
  persistUser();
  emitUser();
  return { pointsEarned: POINTS_PER_SCAN, streak, totalPoints: userState.points };
}

function clearHistory() {
  userState = { ...userState, history: [] };
  persistUser();
  emitUser();
}

/* --------------------------------------------------------------------------
   6. CLASSIFIER
   -------------------------------------------------------------------------- */
const MAX_BYTES = 10 * 1024 * 1024;
const GEMINI_MODEL = "gemini-1.5-flash";
const GEMINI_KEY = "swc-gemini-key";

function getGeminiKey() {
  try { return localStorage.getItem(GEMINI_KEY) || ""; } catch { return ""; }
}
function setGeminiKey(key) {
  try {
    if (key) localStorage.setItem(GEMINI_KEY, key);
    else localStorage.removeItem(GEMINI_KEY);
  } catch {}
}

async function hashFile(file) {
  try {
    const buf = await file.slice(0, Math.min(file.size, 65536)).arrayBuffer();
    const digest = await crypto.subtle.digest("SHA-256", buf);
    const view = new DataView(digest);
    return (view.getUint32(0, false) ^ file.size) >>> 0;
  } catch {
    let h = 0;
    const s = `${file.name}:${file.size}`;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return h >>> 0;
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const r = String(reader.result || "");
      resolve(r.includes(",") ? r.split(",")[1] : r);
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function geminiClassify(file, apiKey) {
  const base64 = await fileToBase64(file);
  const mimeType = file.type || "image/jpeg";
  const prompt = [
    "You are a waste-classification assistant.",
    "Classify the main object into exactly one of:",
    CATEGORIES.join(", ") + ".",
    'Respond with JSON only: {"category":"<one>","confidence":<integer 0-100>}',
  ].join(" ");

  const response = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: mimeType, data: base64 } }] }],
        generationConfig: { temperature: 0.1, responseMimeType: "application/json" },
      }),
    },
  );

  if (!response.ok) throw new Error(`Gemini error: ${response.status}`);
  const json = await response.json();
  const text = json?.candidates?.[0]?.content?.parts?.[0]?.text || "";
  const parsed = JSON.parse(text);
  if (!isWasteCategory(parsed.category)) throw new Error("Invalid category from Gemini");
  const confidence = Number.isFinite(parsed.confidence)
    ? Math.min(100, Math.max(0, Math.round(parsed.confidence))) : 85;
  return { category: parsed.category, confidence, source: "gemini" };
}

async function classifyImage(file) {
  if (!file || !file.type.startsWith("image/")) throw new Error("NOT_IMAGE");
  if (file.size > MAX_BYTES) throw new Error("TOO_LARGE");

  const apiKey = getGeminiKey();
  if (apiKey) {
    try { return await geminiClassify(file, apiKey); }
    catch (err) { console.warn("[classify] Gemini failed, falling back to mock:", err); }
  }

  await new Promise((r) => setTimeout(r, 650));
  const hash = await hashFile(file);
  return {
    category: CATEGORIES[hash % CATEGORIES.length],
    confidence: 82 + (hash % 17),
    source: "mock",
  };
}

/* --- camera --- */
async function openCamera() {
  if (currentRoute !== "scan") return;
  scanState.error = null;

  if (!navigator.mediaDevices?.getUserMedia) {
    scanState.error = t("upload.cameraError");
    renderScanPage();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false,
    });
    // Guard against navigation while permission was pending.
    if (currentRoute !== "scan") {
      stream.getTracks().forEach((tk) => tk.stop());
      return;
    }
    scanState.stream = stream;
    scanState.stage = "camera";
    renderScanPage();
  } catch {
    scanState.error = t("upload.cameraError");
    scanState.stage = "idle";
    renderScanPage();
  }
}

function renderScanCamera() {
  const wrapper = el(`
    <section class="camera-view fade-in">
      <div class="camera-frame">
        <video playsinline autoplay muted></video>
      </div>

        <button type="button" class="btn btn-primary" data-action="capture">

        <button type="button" class="btn btn-ghost" data-action="cancel">
          ${icons.x} ${t("upload.cancel")}
        </button>
      </div>
    </section>
  `);

  scanVideo = wrapper.querySelector("video");
  if (scanState.stream) {
    scanVideo.srcObject = scanState.stream;
    scanVideo.play().catch(() => {});
  }

  wrapper.querySelector('[data-action="capture"]').addEventListener("click", capturePhoto);
  wrapper.querySelector('[data-action="cancel"]').addEventListener("click", () => {
    stopCamera();
    scanState.stage = "idle";
    renderScanPage();
  });

  return wrapper;
}

function capturePhoto() {
  if (!scanVideo) return;
  const width = scanVideo.videoWidth || 720;
  const height = scanVideo.videoHeight || 960;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  ctx.drawImage(scanVideo, 0, 0, width, height);
  canvas.toBlob(
    (blob) => {
      if (!blob) return;
      const file = new File([blob], `capture-${Date.now()}.jpg`, { type: "image/jpeg" });
      stopCamera();
      analyzeFile(file);
    },
    "image/jpeg",
    0.9,
  );
}

/* --- analyzing + analyze --- */
async function analyzeFile(file) {
  if (file.size > MAX_BYTES) {
    scanState.error = t("upload.tooLarge");
    scanState.stage = "idle";
    renderScanPage();
    return;
  }

  if (scanState.preview) {
    try { URL.revokeObjectURL(scanState.preview); } catch {}
  }
  scanState.preview = URL.createObjectURL(file);
  scanState.result = null;
  scanState.awarded = null;
  scanState.error = null;
  scanState.stage = "analyzing";
  renderScanPage();

  try {
    const [thumbnail, result] = await Promise.all([
      createThumbnail(file),
      classifyImage(file),
    ]);
    const outcome = addScan({
      category: result.category,
      confidence: result.confidence,
      thumbnail,
    });
    scanState.result = result;
    scanState.awarded = { points: outcome.pointsEarned, streak: outcome.streak };
    scanState.stage = "result";
    renderScanPage();
  } catch (err) {
    console.error(err);
    scanState.error = err?.message === "TOO_LARGE" ? t("upload.tooLarge") : t("upload.error");
    scanState.stage = "idle";
    renderScanPage();
  }
}

function parseRoute() {
  const hash = location.hash.replace(/^#\/?/, "").toLowerCase();
  return hash === "history" ? "history" : "scan";
}

function route() {
  const next = parseRoute();
  if (next !== currentRoute) {
    if (currentRoute === "scan") cleanupScanPage();
    currentRoute = next;
  }

  renderNavbar();

  if (currentRoute === "scan") renderScanPage();
  else renderHistoryPage();
}

/* --------------------------------------------------------------------------
   12. BOOTSTRAP
   -------------------------------------------------------------------------- */
function boot() {
  initLocale();
  loadUser();

  renderNavbar();
  renderFooter();

  window.addEventListener("hashchange", route);

  onLocaleChange(() => {
    renderNavbar();
    renderFooter();
    if (currentRoute === "scan") renderScanPage();
    else renderHistoryPage();
  });

  onUserChange(() => {
    updateNavbarStats();
    if (currentRoute === "history") renderHistoryPage();
  });

  route();
}

boot();
    
  </script>
</body>
</html>
