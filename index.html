  <script>
    // Pre-paint theme
    (function () {
      try {
        var s = localStorage.getItem("swc-theme");
        if (s === "dark" || (!s && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
</head>
